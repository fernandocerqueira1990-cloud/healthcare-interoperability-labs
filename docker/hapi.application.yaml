spring:
  datasource:
    url: jdbc:postgresql://db:5432/hapi
    username: admin
    password: admin
    driverClassName: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
        search:
          enabled: false

hapi:
  fhir:
    fhir_version: R4
